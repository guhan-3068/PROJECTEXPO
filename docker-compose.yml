version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: docverify_db
    restart: always
    environment:
      POSTGRES_USER: docverify
      POSTGRES_PASSWORD: secure_db_password_123!
      POSTGRES_DB: docverify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docverify_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://docverify:secure_db_password_123!@db:5432/docverify_db
      - SECRET_KEY=super-secret-key-production-change-me-32-chars-minimum
      - APP_ENV=production
      - DEBUG=False
      - STORAGE_ROOT=/storage
    volumes:
      - doc_storage:/storage
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: docverify_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_data:
  doc_storage:
